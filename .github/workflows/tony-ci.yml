name: Tony Knowledge Garden CI

on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Build knowledge garden
        run: npx quartz build -d content

      - name: Verify output
        run: |
          test -d public || { echo "Build output missing"; exit 1; }
          test -f public/index.html || { echo "index.html missing"; exit 1; }
          test -f public/sitemap.xml || { echo "sitemap.xml missing"; exit 1; }
          echo "Build verified successfully"

      - name: Check SEO meta tags
        run: |
          grep -q "<title>" public/index.html || { echo "Missing title tag"; exit 1; }
          grep -q "description" public/index.html || { echo "Missing description meta"; exit 1; }
          echo "SEO meta tags verified"

      - name: Check structured data
        run: |
          grep -q "application/ld+json" public/index.html || { echo "Missing JSON-LD"; exit 1; }
          echo "Structured data verified"

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
